name: Sentinel

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "sentinel/**"
      - "requirements.txt"
      - ".github/workflows/sentinel.yml"

# Noms alignés sur les secrets GitHub (et alias courants).
# Requis : SUPABASE_URL (sinon URL projet par défaut),
#          SUPABASE_SERVICE_KEY ou SUPABASE_ANON_KEY,
#          FINNHUB_API_KEY, GEMINI_API_KEY, GROQ_API_KEY,
#          TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
concurrency:
  group: sentinel-pipeline
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://zayezktpxysiwlhbchqk.supabase.co' }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          python - <<'PY'
          import traceback
          from sentinel.config import get_supabase, supabase_url
          print(f"SUPABASE_URL={supabase_url()}")
          try:
              client = get_supabase()
              n = len(client.table("portfolio").select("symbol").execute().data or [])
              print(f"portfolio rows={n}")
          except Exception as exc:
              print(f"::error::Supabase auth failed: {exc}")
              traceback.print_exc()
              raise
          PY

      - name: Ingest
        run: python -m sentinel.ingest

      - name: Filter
        run: python -m sentinel.filter

      - name: LLM
        run: python -m sentinel.llm

      - name: Notify
        run: python -m sentinel.notify
